<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Employee Information Form</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div>
      <form class="main-form" action="#" method="post">
        <div class="form-div heading">
          <h2>Employee Information Form</h2>
        </div>

        <div class="form-div text-input">
          <label for="fullName">Full Name:</label><br />
          <input
            type="text"
            id="fullName"
            name="fullName"
            required
            placeholder="Enter full name"
          /><br /><br />
        </div>

        <div class="form-div text-input">
          <label for="contact">Contact Number:</label><br />
          <input
            type="tel"
            id="contact"
            name="contact"
            pattern="[0-9]{10}"
            required
            placeholder="Enter your contact"
          /><br /><br />
        </div>

        <div class="form-div text-input">
          <label for="address">Address:</label><br />
          <textarea
            id="address"
            name="address"
            rows="4"
            cols="40"
            required
          ></textarea
          ><br /><br />
        </div>

        <div class="form-div text-input">
          <label for="company">Company Name:</label><br />
          <input type="text" id="company" name="company" required placeholder="Enter company name"/><br /><br />
        </div>
        <div class="form-div text-input">
          <label for="email">Email Address:</label><br />
          <input type="email" id="email" name="email" required placeholder="Enter your email" /><br /><br />
        </div>
        <div class="form-div">
          <label for="department">Department:</label><br />
          <h3 class="arrow">></h3>
          <select id="department" name="department" required>
            <option value="">-- Select Department --</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="Development">Development</option>
            <option value="Marketing">Marketing</option>
            <option value="Others">Others</option></select
          ><br /><br />
        </div>
        <div class="form-div">
          <label class="radio-label">Gender:</label><br />
          <input class="radio-btn" type="radio" id="male" name="gender" value="Male" required />
          <label for="male">Male</label><br />

          <input class="radio-btn" type="radio" id="female" name="gender" value="Female" />
          <label for="female">Female</label><br />
          <input
            type="radio"
            id="preferNot"
            name="gender"
            value="Prefer not to say"
            class="radio-btn"
          />
          <label for="preferNot">Prefer not to say</label><br /><br />
        </div>

      
        <button class="btn" type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
